<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGen Atlas - Active Test Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .badge-type { background: #4f46e5; color: white; padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: 500; }
        .badge-lang { background: #0284c7; color: white; padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: 500; }
        .btn-submit { background: linear-gradient(135deg, #10b981, #059669); border: none; color: white; font-weight: 600; padding: 0.75rem 2rem; border-radius: 0.5rem; }
        .btn-submit:hover { color: white; opacity: 0.95; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-atlas text-primary fs-4"></i>
                <span>QGen Atlas</span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> New Query</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Generated Assessment Session</h2>
                <p class="text-muted mb-0">Answer the generated queries below to validate your comprehension against expected answers.</p>
            </div>
            <div class="d-flex gap-2">
                <span class="badge-type"><i class="fa-solid fa-pen-to-square me-1"></i> Mode: {{ test_type|capitalize }}</span>
                <span class="badge-lang"><i class="fa-solid fa-language me-1"></i> Language: {{ lang_name }}</span>
            </div>
        </div>

        <form action="/validate" method="POST">
            {% for q in questions %}
                <div class="card card-custom p-4 mb-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary rounded-pill px-3 py-2">Question {{ loop.index }}</span>
                    </div>
                    <h5 class="fw-semibold text-dark mb-3">{{ q.question }}</h5>
                    <div class="mb-2">
                        <label for="user_answer_{{ q.id }}" class="form-label text-muted fw-semibold">Your Response:</label>
                        <input type="text" class="form-control form-control-lg" id="user_answer_{{ q.id }}" name="user_answer_{{ q.id }}" placeholder="Type your answer here..." required autocomplete="off">
                    </div>
                </div>
            {% endfor %}

            <div class="text-end my-4">
                <button type="submit" class="btn btn-submit btn-lg shadow-sm">
                    <i class="fa-solid fa-check-double me-2"></i>Submit Answers & Validate Scores
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
